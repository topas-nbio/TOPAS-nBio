# ============================================================================================================= #
#                                                                                                               #
# This workflow builds TOPAS-nBio and postprocessing images and pushes them to AWS ECR. It only runs manually.  #
#                                                                                                               #
# TOPAS-nBio uses a versioned tag plus a latest alias; postprocessing uses "postprocessing".                    #
#                                                                                                               #
# Existing images are retained so registered AWS Batch jobs can continue using pinned tags.                   #
#                                                                                                               #
# Required GitHub Secrets (Settings → Secrets and variables → Actions):                                         #
#   AWS_ROLE_ARN                                                                                                #
#   ECR_REPOSITORY_URI                                                                                          #
# ============================================================================================================= #

name: Build and push to ECR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Output image tag; default identifies the TOPAS/Geant4 base and architecture'
        required: false
        default: 'topas-v4.3.0-geant4-11.3.2-amd64'

env:
  OPENTOPAS_IMAGE: opentopas/opentopas:v4.3.0-geant4-11.3.2-amd64
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build image and push to ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.inputs.tag || 'topas-v4.3.0-geant4-11.3.2-amd64' }}

    steps:
      - name: Validate image tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $TAG"
            exit 1
          fi
          echo "Using tag: $TAG"

      - name: Checkout TOPAS-nBio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Pull OpenTOPAS base image
        run: docker pull ${{ env.OPENTOPAS_IMAGE }}

      - name: Build image with TOPAS-nBio extension
        run: |
          docker build \
            --platform=linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f .github/workflows/cloud/dockerFile.txt \
            --build-arg "OPENTOPAS_IMAGE=${{ env.OPENTOPAS_IMAGE }}" \
            -t ${{ secrets.ECR_REPOSITORY_URI }}:${TAG} .

      - name: Push TOPAS image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:${TAG}
          if [[ "${TAG}" != "latest" ]]; then
            docker tag ${{ secrets.ECR_REPOSITORY_URI }}:${TAG} ${{ secrets.ECR_REPOSITORY_URI }}:latest
            docker push ${{ secrets.ECR_REPOSITORY_URI }}:latest
          fi

      - name: Build postprocess image
        run: |
          docker build \
            --platform=linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f .github/workflows/cloud/dockerFilePostP.txt \
            -t ${{ secrets.ECR_REPOSITORY_URI }}:postprocessing .

      - name: Push postprocess image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:postprocessing

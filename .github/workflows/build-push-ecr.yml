# ============================================================================================================= #
#                                                                                                               #
# This workflow builds TOPAS-nBio and postprocessing images and pushes them to AWS ECR. It only runs manually.  #
#                                                                                                               #
# The default tag for the TOPAS-nBio image is "latest". If this is changed the cloud section in the TOPAS-nBio  # 
# ReadTheDocs also needs to be updated.                                                                         #
#                                                                                                               #
# Before pushing the images to ECR, all existing images in the repository are deleted. This safeguard was added #
# to remain below the 50 Gb/month limit imposed by AWS ECR Public.                                              #
#                                                                                                               #
# Required GitHub Secrets (Settings → Secrets and variables → Actions):                                         #
#   AWS_ROLE_ARN                                                                                                #
#   ECR_REPOSITORY_URI                                                                                          #
# ============================================================================================================= #

name: Build and push to ECR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the TOPAS-nBio image (default: latest)'
        required: false
        default: 'latest'

env:
  OPENTOPAS_IMAGE: opentopas/opentopas:latest
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build image and push to ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.inputs.tag || 'latest' }}

    steps:
      - name: Set image tag
        run: |
          if [ -z "${{ env.TAG }}" ] || [ "${{ env.TAG }}" = "-" ]; then
            echo "TAG=latest" >> "$GITHUB_ENV"
          fi
          echo "Using tag: ${{ env.TAG }}"

      - name: Checkout TOPAS-nBio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Delete all images in ECR repository
        run: |
          REPO_URI="${{ secrets.ECR_REPOSITORY_URI }}"
          REPO_NAME="${REPO_URI##*/}"
          echo "Deleting all images in ECR Public repository: ${REPO_NAME}"
          aws ecr-public describe-images --repository-name "${REPO_NAME}" --output json > /tmp/images.json || true
          if [ ! -s /tmp/images.json ]; then
            echo "Repository is empty, nothing to delete."
            exit 0
          fi
          for DIGEST in $(jq -r '.imageDetails[].imageDigest' /tmp/images.json | sort -u); do
            echo "Deleting digest: ${DIGEST}"
            aws ecr-public batch-delete-image \
              --repository-name "${REPO_NAME}" \
              --image-ids imageDigest="${DIGEST}" || true
          done

      - name: Pull OpenTOPAS base image
        run: docker pull ${{ env.OPENTOPAS_IMAGE }}

      - name: Build image with TOPAS-nBio extension
        run: |
          docker build \
            --platform=linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f .github/workflows/dockerFile.ecr \
            -t ${{ secrets.ECR_REPOSITORY_URI }}:${{ env.TAG }} .

      - name: Push TOPAS image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:${{ env.TAG }}
          if [[ "${{ env.TAG }}" != "latest" ]]; then
            docker tag ${{ secrets.ECR_REPOSITORY_URI }}:${{ env.TAG }} ${{ secrets.ECR_REPOSITORY_URI }}:latest
            docker push ${{ secrets.ECR_REPOSITORY_URI }}:latest
          fi

      - name: Build postprocess image
        run: |
          docker build \
            --platform=linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f .github/workflows/dockerFilePostP.ecr \
            -t ${{ secrets.ECR_REPOSITORY_URI }}:postprocess .

      - name: Push postprocess image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:postprocess

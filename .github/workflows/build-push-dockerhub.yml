# ============================================================================================================= #
#                                                                                                               #
# This workflow builds TOPAS-nBio and postprocessing images and pushes them to Docker Hub. It only runs         #
# manually (workflow_dispatch).                                                                                 #
#                                                                                                               #
# TOPAS-nBio is tagged with the name "latest", while the postprocessing image uses the tag "postprocessing".    #
# Both are pushed to the Docker Hub repository named in DOCKERHUB_IMAGE.                                        #
#                                                                                                               #
# Required GitHub Secrets (Settings → Secrets and variables → Actions):                                         #
#   DOCKERHUB_USERNAME  - Docker Hub username                                                                   #
#   DOCKERHUB_TOKEN     - Docker Hub personal access token                                                      #
# ============================================================================================================= #

# Optional destination: the first push may create this repository if Docker Hub
# organization permissions and namespace settings allow it. See aws/README.md.
name: Build and push to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the TOPAS-nBio image (default: latest)'
        required: false
        default: 'latest'

env:
  OPENTOPAS_IMAGE: opentopas/opentopas:v4.3.0-geant4-11.3.2-amd64
  DOCKERHUB_IMAGE: opentopas/topas-nbio

jobs:
  build-and-push:
    name: Build image and push to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.inputs.tag || 'latest' }}

    steps:
      - name: Validate image tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $TAG"
            exit 1
          fi
          echo "Using tag: $TAG"

      - name: Checkout TOPAS-nBio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull OpenTOPAS base image
        run: docker pull ${{ env.OPENTOPAS_IMAGE }}

      - name: Build image with TOPAS-nBio extension
        run: |
          docker build \
            --platform=linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f .github/workflows/cloud/dockerFile.txt \
            --build-arg "OPENTOPAS_IMAGE=${{ env.OPENTOPAS_IMAGE }}" \
            -t ${{ env.DOCKERHUB_IMAGE }}:${TAG} \
            .

      - name: Push TOPAS image to Docker Hub
        run: |
          docker push ${{ env.DOCKERHUB_IMAGE }}:${TAG}
          if [[ "${TAG}" != "latest" ]]; then
            docker tag ${{ env.DOCKERHUB_IMAGE }}:${TAG} ${{ env.DOCKERHUB_IMAGE }}:latest
            docker push ${{ env.DOCKERHUB_IMAGE }}:latest
          fi

      - name: Build postprocess image
        run: |
          docker build \
            --platform=linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f .github/workflows/cloud/dockerFilePostP.txt \
            -t ${{ env.DOCKERHUB_IMAGE }}:postprocessing \
            .

      - name: Push postprocess image to Docker Hub
        run: |
          docker push ${{ env.DOCKERHUB_IMAGE }}:postprocessing

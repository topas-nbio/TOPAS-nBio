# ============================================================================================================= #
#                                                                                                               #
# This workflow builds TOPAS-nBio and postprocessing images and pushes them to Docker Hub. It only runs         #
# manually (workflow_dispatch).                                                                                 #
#                                                                                                               #
# TOPAS-nBio is tagged with the name "latest", while the postprocessing image uses the tag "postprocess".       #
# Both are pushed to the Docker Hub repository named in DOCKERHUB_IMAGE.                                        #
#                                                                                                               #
# Required GitHub Secrets (Settings → Secrets and variables → Actions):                                         #
#   DOCKERHUB_USERNAME  - Docker Hub username                                                                   #
#   DOCKERHUB_TOKEN     - Docker Hub access token (or password)                                                 #
# ============================================================================================================= #

name: Build and push to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the TOPAS-nBio image (default: latest)'
        required: false
        default: 'latest'

env:
  OPENTOPAS_IMAGE: opentopas/opentopas:latest
  DOCKERHUB_IMAGE: tmasilela/topas-nbio

jobs:
  build-and-push:
    name: Build image and push to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.inputs.tag || 'latest' }}

    steps:
      - name: Set image tag
        run: |
          if [ -z "${{ env.TAG }}" ] || [ "${{ env.TAG }}" = "-" ]; then
            echo "TAG=latest" >> "$GITHUB_ENV"
          fi
          echo "Using tag: ${{ env.TAG }}"

      - name: Checkout TOPAS-nBio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull OpenTOPAS base image
        run: docker pull ${{ env.OPENTOPAS_IMAGE }}

      - name: Build image with TOPAS-nBio extension
        run: |
          docker build \
            --platform=linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f .github/workflows/cloud/dockerFile.ecr \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ env.TAG }} \
            .

      - name: Push TOPAS image to Docker Hub
        run: |
          docker push ${{ env.DOCKERHUB_IMAGE }}:${{ env.TAG }}
          if [[ "${{ env.TAG }}" != "latest" ]]; then
            docker tag ${{ env.DOCKERHUB_IMAGE }}:${{ env.TAG }} ${{ env.DOCKERHUB_IMAGE }}:latest
            docker push ${{ env.DOCKERHUB_IMAGE }}:latest
          fi

      - name: Build postprocess image
        run: |
          docker build \
            --platform=linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f .github/workflows/cloud/dockerFilePostP.ecr \
            -t ${{ env.DOCKERHUB_IMAGE }}:postprocess \
            .

      - name: Push postprocess image to Docker Hub
        run: |
          docker push ${{ env.DOCKERHUB_IMAGE }}:postprocess
